apiVersion: apps/v1
kind: Deployment
metadata:
  name: disney-watchlist
  labels:
    app: disney-watchlist
spec:
  replicas: 1
  selector:
    matchLabels:
      app: disney-watchlist
  template:
    metadata:
      labels:
        app: disney-watchlist
    spec:
      containers:
        - name: disney-watchlist
          image: ghcr.io/ralphdevlab/disney-watchlist:e58be8a3cbab8f30d9e3bb9077bf840345e971a1
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
apiVersion: apps/v1
kind: Deployment
metadata:
  name: disney-watchlist
  labels:
    app: disney-watchlist
spec:
  replicas: 2
  selector:
    matchLabels:
      app: disney-watchlist
  template:
    metadata:
      labels:
        app: disney-watchlist
    spec:
      containers:
        - name: disney-watchlist
          image: ghcr.io/ralphdevlab/disney-watchlist:4e1edf420211d3cb2493428fa22833f72d70610a
          ports:
            - containerPort: 8080
          readinessProbe:
            tcpSocket:
              port: 8080
            initialDelaySeconds: 20
            periodSeconds: 5
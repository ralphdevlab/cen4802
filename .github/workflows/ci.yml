name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Make gradlew runnable
        run: chmod +x gradlew

      - name: Build, run unit tests, and package
        run: ./gradlew clean build

      - name: Save the packaged jar
        uses: actions/upload-artifact@v4
        with:
          name: disney-watchlist-jar
          path: build/libs/disney_watchlist-0.0.1-SNAPSHOT.jar

  docker-image:
    # only runs if build-and-test succeeded, and only for pushes to main
    needs: build-and-test
    if: github.ref == 'refs/heads/main' && github.event_name == 'push'
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Get the code
        uses: actions/checkout@v4

      - name: Get the jar that the build job made
        uses: actions/download-artifact@v4
        with:
          name: disney-watchlist-jar
          path: build/libs

      - name: Log in to GitHub Container Registry
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push the Docker image
        uses: docker/build-push-action@v6
        with:
          context: .
          push: true
          tags: |
            ghcr.io/${{ github.repository_owner }}/disney-watchlist:latest
            ghcr.io/${{ github.repository_owner }}/disney-watchlist:${{ github.sha }}
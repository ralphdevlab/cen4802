spring.application.name=disney_watchlist

# ---- Logging (Logback, the default in Spring Boot) ----
# Default level for everything (Spring, Hibernate, Tomcat...)
logging.level.root=INFO
# Our own code logs at DEBUG so we see detailed activity
logging.level.com.ralph.disney_watchlist=DEBUG
# Console output: timestamp, level, thread, logger name, message
logging.pattern.console=%d{yyyy-MM-dd HH:mm:ss.SSS} %-5level [%thread] %logger{30} - %msg%n